x-node-volumes: &node-volumes
  - .:/app
  - node_modules:/app/node_modules
  - medfolio_node_modules:/app/apps/medfolio/node_modules
  - medfolio_api_node_modules:/app/apps/medfolio-api/node_modules
  - pnpm_store:/pnpm/store

services:
  deps:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    command: pnpm install --frozen-lockfile
    working_dir: /app
    volumes: *node-volumes

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER no .env (copia de .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD no .env (copia de .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB no .env (copia de .env.example)}
      APP_DB_USER: ${APP_DB_USER:?define APP_DB_USER no .env (copia de .env.example)}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?define APP_DB_PASSWORD no .env (copia de .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    command: pnpm --parallel --filter @nexo-centro/db --filter medfolio-api dev
    working_dir: /app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?define DATABASE_URL no .env (copia de .env.example)}
      CORS_ORIGIN: ${CORS_ORIGIN:?define CORS_ORIGIN no .env (copia de .env.example)}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      APP_ENCRYPTION_KEY_VERSION: ${APP_ENCRYPTION_KEY_VERSION:-1}
      APP_ENCRYPTION_KEYS_RETIRED: ${APP_ENCRYPTION_KEYS_RETIRED:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TWO_FACTOR_CHALLENGE_TTL: ${TWO_FACTOR_CHALLENGE_TTL:-5m}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3001:3001"
    volumes: *node-volumes
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    command: pnpm --filter medfolio dev
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
      VITE_API_PROXY_TARGET: http://api:3001
    ports:
      - "5173:5173"
    volumes: *node-volumes
    depends_on:
      deps:
        condition: service_completed_successfully

volumes:
  node_modules:
  medfolio_node_modules:
  medfolio_api_node_modules:
  pnpm_store:
  pgdata:
