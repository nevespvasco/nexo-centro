x-node-volumes: &node-volumes
  - .:/app
  - node_modules:/app/node_modules
  - medfolio_node_modules:/app/apps/medfolio/node_modules
  - medfolio_api_node_modules:/app/apps/medfolio-api/node_modules

services:
  deps:
    build:
      context: .
      dockerfile: apps/medfolio-api/Dockerfile
      target: dev
    command: pnpm install --frozen-lockfile
    working_dir: /app
    volumes: *node-volumes

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/medfolio-api/Dockerfile
      target: dev
    command: pnpm --filter medfolio-api dev
    working_dir: /app
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "3001:3001"
    volumes: *node-volumes
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/medfolio/Dockerfile
      target: dev
    command: pnpm --filter medfolio dev
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING}
    ports:
      - "5173:5173"
    volumes: *node-volumes
    depends_on:
      deps:
        condition: service_completed_successfully

volumes:
  node_modules:
  medfolio_node_modules:
  medfolio_api_node_modules:
  pgdata:
